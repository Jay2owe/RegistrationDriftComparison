schema_version: 1
id: compare-registration-launch
name: Open Compare Registration Methods and cancel cleanly
description: >
  Proves the installed plugin is reachable from its registered comparison menu
  entry, opens the five-mode dialog with a recording available, and closes
  without dispatching an engine when Cancel is pressed.

requires:
  test_automation: true
  physical_input: true
  plugin_under_test: true
  plugin: Registration and Drift Comparison
  menu_path: [Plugins, Registration, "Compare Registration Methods..."]

policy:
  allow_labels: ["Compare Registration Methods...", Cancel]
  allow_risks: [read_only, reversible, mutating]
  allow_write_roots: [exports]
  allow_legacy_selectors: false
  reviewer: harness
  reason: >
    The route uses a synthetic image in the disposable Fiji sandbox, opens the
    plugin's real menu entry, then cancels before an engine can run or a file
    can be written.

setup:
  - id: fixture_image
    name: create a short synthetic recording
    action: run_macro
    risk: mutating
    macro: |
      newImage("regdrift_compare_fixture", "8-bit noise", 64, 64, 8);
    expect:
      first_feedback:
        within_ms: 2000
        any_of: [window_appeared, image_revision_changed]
      completion:
        within_ms: 10000
        console_errors: absent

steps:
  - id: open_menu
    name: click Plugins > Registration > Compare Registration Methods...
    action: physical_menu
    risk: mutating
    window: {title: "(Fiji Is Just) ImageJ", match: contains}
    menu_path: [Plugins, Registration, "Compare Registration Methods..."]
    expect:
      dispatch: {visible: true, enabled: true, exactly_once: true}
      first_feedback:
        within_ms: 3000
        any_of: [window_appeared, focus_changed]
      completion:
        within_ms: 10000
        window_present: "Registration & Drift Comparison - Compare Registration Methods"
        unexpected_modal: false
        console_errors: absent

  - id: inspect_dialog
    name: verify the comparison dialog is visible and cancellable
    action: inspect_ui
    risk: read_only
    window: {title: "Registration & Drift Comparison - Compare Registration Methods", match: exact}
    assertions:
      - kind: component_state
        window: "Registration & Drift Comparison - Compare Registration Methods"
        component: {role: button, name: Cancel, match: exact}
        expected: {enabled: true, showing: true}
      - kind: no_uncaught_exceptions

  - id: choose_diagnose
    name: select Diagnose
    action: physical_click
    risk: reversible
    window: {title: "Registration & Drift Comparison - Compare Registration Methods", match: exact}
    component: {role: radio_button, name: Diagnose, match: exact}
    expect:
      dispatch: {visible: true, enabled: true, exactly_once: true}
      first_feedback:
        within_ms: 1500
        any_of: [focus_changed, value_changed]
      completion:
        within_ms: 5000
        window_present: "Registration & Drift Comparison - Compare Registration Methods"
        unexpected_modal: false

  - id: inspect_diagnose
    name: verify Diagnose is selected
    action: inspect_ui
    risk: read_only
    window: {title: "Registration & Drift Comparison - Compare Registration Methods", match: exact}
    assertions:
      - kind: component_state
        window: "Registration & Drift Comparison - Compare Registration Methods"
        component: {role: radio_button, name: Diagnose, match: exact}
        expected: {enabled: true, showing: true, selected: true}

  - id: choose_diagnose_recommend
    name: select Diagnose and recommend
    action: physical_click
    risk: reversible
    window: {title: "Registration & Drift Comparison - Compare Registration Methods", match: exact}
    component: {role: radio_button, name: Diagnose and recommend, match: exact}
    expect:
      dispatch: {visible: true, enabled: true, exactly_once: true}
      first_feedback:
        within_ms: 1500
        any_of: [focus_changed, value_changed]
      completion:
        within_ms: 5000
        window_present: "Registration & Drift Comparison - Compare Registration Methods"
        unexpected_modal: false

  - id: inspect_diagnose_recommend
    name: verify Diagnose and recommend is selected
    action: inspect_ui
    risk: read_only
    window: {title: "Registration & Drift Comparison - Compare Registration Methods", match: exact}
    assertions:
      - kind: component_state
        window: "Registration & Drift Comparison - Compare Registration Methods"
        component: {role: radio_button, name: Diagnose and recommend, match: exact}
        expected: {enabled: true, showing: true, selected: true}

  - id: choose_apply
    name: select Recommend and apply
    action: physical_click
    risk: reversible
    window: {title: "Registration & Drift Comparison - Compare Registration Methods", match: exact}
    component: {role: radio_button, name: Recommend and apply, match: exact}
    expect:
      dispatch: {visible: true, enabled: true, exactly_once: true}
      first_feedback:
        within_ms: 1500
        any_of: [focus_changed, value_changed]
      completion:
        within_ms: 5000
        window_present: "Registration & Drift Comparison - Compare Registration Methods"
        unexpected_modal: false

  - id: inspect_apply
    name: verify Recommend and apply is selected
    action: inspect_ui
    risk: read_only
    window: {title: "Registration & Drift Comparison - Compare Registration Methods", match: exact}
    assertions:
      - kind: component_state
        window: "Registration & Drift Comparison - Compare Registration Methods"
        component: {role: radio_button, name: Recommend and apply, match: exact}
        expected: {enabled: true, showing: true, selected: true}

  - id: choose_compare
    name: select Compare installed engines
    action: physical_click
    risk: reversible
    window: {title: "Registration & Drift Comparison - Compare Registration Methods", match: exact}
    component: {role: radio_button, name: Compare installed engines, match: exact}
    expect:
      dispatch: {visible: true, enabled: true, exactly_once: true}
      first_feedback:
        within_ms: 1500
        any_of: [focus_changed, value_changed]
      completion:
        within_ms: 5000
        window_present: "Registration & Drift Comparison - Compare Registration Methods"
        unexpected_modal: false

  - id: inspect_compare
    name: verify Compare installed engines is selected
    action: inspect_ui
    risk: read_only
    window: {title: "Registration & Drift Comparison - Compare Registration Methods", match: exact}
    assertions:
      - kind: component_state
        window: "Registration & Drift Comparison - Compare Registration Methods"
        component: {role: radio_button, name: Compare installed engines, match: exact}
        expected: {enabled: true, showing: true, selected: true}

  - id: choose_score
    name: select Score an existing result
    action: physical_click
    risk: reversible
    window: {title: "Registration & Drift Comparison - Compare Registration Methods", match: exact}
    component: {role: radio_button, name: Score an existing result, match: exact}
    expect:
      dispatch: {visible: true, enabled: true, exactly_once: true}
      first_feedback:
        within_ms: 1500
        any_of: [focus_changed, value_changed]
      completion:
        within_ms: 5000
        window_present: "Registration & Drift Comparison - Compare Registration Methods"
        unexpected_modal: false

  - id: inspect_score
    name: verify Score an existing result is selected
    action: inspect_ui
    risk: read_only
    window: {title: "Registration & Drift Comparison - Compare Registration Methods", match: exact}
    assertions:
      - kind: component_state
        window: "Registration & Drift Comparison - Compare Registration Methods"
        component: {role: radio_button, name: Score an existing result, match: exact}
        expected: {enabled: true, showing: true, selected: true}

teardown:
  - id: cancel_dialog
    name: cancel the comparison dialog
    action: physical_click
    risk: reversible
    window: {title: "Registration & Drift Comparison - Compare Registration Methods", match: exact}
    component: {role: button, name: Cancel, match: exact}
    expect:
      dispatch: {visible: true, enabled: true, exactly_once: true}
      first_feedback:
        within_ms: 1000
        any_of: [window_closed]
      completion:
        within_ms: 5000
        window_absent: "Registration & Drift Comparison - Compare Registration Methods"
        unexpected_modal: false

cleanup:
  close_windows: ["Registration & Drift Comparison - Compare Registration Methods"]
  close_all_images: true
  clear_results: true
  reset_roi_manager: true
  expect_no_new_files: true
  fixture_hashes_unchanged: true
