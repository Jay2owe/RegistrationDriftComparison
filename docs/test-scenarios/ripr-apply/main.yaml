schema_version: 1
id: ripr-apply-hyperstack
name: Select bundled RIPR and apply it to a hyperstack
description: >
  Proves a person can select the bundled Relative-Intensity Pattern Registration
  (RIPR) engine in the real Apply workflow, run it on a 2-channel by 2-Z-slice
  by 4-frame synthetic recording, and receive a registered 16-plane image
  beside the source. This is physical UI evidence for the apply route, not a claim that
  user-marked review issues, biological video behaviour, or split behaviour are
  fixed or reviewed.

requires:
  test_automation: true
  physical_input: true
  plugin_under_test: true
  plugin: Registration and Drift Comparison
  menu_path: [Plugins, Registration, "Compare Registration Methods..."]

policy:
  allow_labels: ["Compare Registration Methods...", "Run it", OK, Cancel]
  allow_risks: [read_only, reversible, mutating]
  allow_write_roots: [exports]
  allow_legacy_selectors: false
  reviewer: harness
  reason: >
    The route uses a synthetic translated hyperstack in the disposable Fiji
    sandbox, selects the bundled engine, and permits only the reversible in-place
    registration result; no file output is requested.

performance:
  warmup_runs: 0
  measured_runs: 1
  budget_first_feedback_ms: 5000
  budget_completion_ms: 180000
  mode: audit

setup:
  - id: fixture_image
    name: create a translated 2-channel 2-Z 4-frame recording
    action: run_macro
    risk: mutating
    macro: |
      newImage("ripr_apply_fixture", "8-bit black", 96, 96, 16);
      Stack.setDimensions(2, 2, 4);
      for (frame = 1; frame <= 4; frame++) {
        for (channel = 1; channel <= 2; channel++) {
          for (slice = 1; slice <= 2; slice++) {
            Stack.setPosition(channel, slice, frame);
            setColor(0);
            run("Select All");
            fill();
            setColor(255);
            makeRectangle(18 + frame * 3 + channel * 2, 24 + slice * 3, 28, 24);
            fill();
            drawLine(12 + frame * 3, 72 - slice * 2, 82 + frame * 3, 72 - slice * 2);
          }
        }
      }
      run("Select None");
      resetMinAndMax();
    expect:
      first_feedback:
        within_ms: 2000
        any_of: [window_appeared, image_revision_changed]
      completion:
        within_ms: 10000
        console_errors: absent

steps:
  - id: open_menu
    name: click Plugins > Registration > Compare Registration Methods...
    action: physical_menu
    risk: mutating
    window: {title: "(Fiji Is Just) ImageJ", match: contains}
    menu_path: [Plugins, Registration, "Compare Registration Methods..."]
    expect:
      dispatch: {visible: true, enabled: true, exactly_once: true}
      first_feedback:
        within_ms: 3000
        any_of: [window_appeared, focus_changed]
      completion:
        within_ms: 10000
        window_present: "Registration & Drift Comparison - Compare Registration Methods"
        unexpected_modal: false
        console_errors: absent

  - id: choose_apply
    name: select Recommend and apply
    action: physical_click
    risk: reversible
    window: {title: "Registration & Drift Comparison - Compare Registration Methods", match: exact}
    component: {role: radio_button, name: Recommend and apply, match: exact}
    expect:
      dispatch: {visible: true, enabled: true, exactly_once: true}
      first_feedback:
        within_ms: 1500
        any_of: [focus_changed, value_changed]
      completion:
        within_ms: 5000
        window_present: "Registration & Drift Comparison - Compare Registration Methods"
        unexpected_modal: false

  - id: set_ripr
    name: type the bundled RIPR engine name
    action: physical_replace_text
    risk: reversible
    window: {title: "Registration & Drift Comparison - Compare Registration Methods", match: exact}
    component: {role: text_field, name: "Engine to run", match: exact}
    value: "Relative-Intensity Pattern Registration (RIPR)"
    expect:
      dispatch: {visible: true, enabled: true, exactly_once: true}
      first_feedback:
        within_ms: 1500
        any_of: [value_changed, focus_changed]
      completion:
        within_ms: 5000
        window_present: "Registration & Drift Comparison - Compare Registration Methods"
        unexpected_modal: false

  - id: accept_settings
    name: accept the physical RIPR apply settings
    action: physical_click
    risk: mutating
    window: {title: "Registration & Drift Comparison - Compare Registration Methods", match: exact}
    component: {role: button, name: OK, match: exact}
    expect:
      dispatch: {visible: true, enabled: true, exactly_once: true}
      first_feedback:
        within_ms: 3000
        any_of: [window_appeared, focus_changed]
      completion:
        within_ms: 10000
        window_present: "Registration & Drift Comparison - Before this starts"
        unexpected_modal: false
        console_errors: absent

  - id: run_ripr
    name: confirm Run it and apply RIPR
    action: physical_click
    measured: true
    risk: mutating
    window: {title: "Registration & Drift Comparison - Before this starts", match: exact}
    component: {role: button, name: "Run it", match: exact}
    expect:
      dispatch: {visible: true, enabled: true, exactly_once: true}
      first_feedback:
        within_ms: 5000
        any_of: [window_closed, progress_started, image_revision_changed]
      completion:
        within_ms: 180000
        window_absent: "Registration & Drift Comparison - Before this starts"
        unexpected_modal: false
        console_errors: absent
        ui_idle: true
    assertions:
      - {kind: image_count, expected: 2}
      - {kind: image_open, title: "RegDrift arm 1 - Relative-Intensity Pattern Registration (RIPR)"}
      - {kind: image_dimensions, title: "RegDrift arm 1 - Relative-Intensity Pattern Registration (RIPR)", width: 96, height: 96, depth: 2}
      - {kind: console_clean}
      - {kind: no_uncaught_exceptions}

cleanup:
  close_windows: ["Registration & Drift Comparison - Before this starts"]
  close_all_images: true
  clear_results: true
  reset_roi_manager: true
  expect_no_new_files: true
  fixture_hashes_unchanged: true
