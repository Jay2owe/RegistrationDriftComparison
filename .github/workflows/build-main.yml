name: Build

on:
  push:
  pull_request:

# This plugin compiles two cores in rather than requiring them as installs, so
# a clean runner cannot resolve them: it builds them from source first. They
# are published to no Maven repository on purpose - a core a user could
# download separately is a core two plugins can disagree about the version of.
#
# The refs are pinned release tags, each matching the fixed version declared in
# pom.xml, so every public build shades the same source.
env:
  OC3D_CORE_REPO: Jay2owe/oc3d-core
  OC3D_CORE_REF: v0.2.0
  AUTOFIX_CORE_REPO: Jay2owe/autofix-core
  AUTOFIX_CORE_REF: v0.1.0

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the plugin
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Check out oc3d-core
        uses: actions/checkout@v4
        with:
          repository: ${{ env.OC3D_CORE_REPO }}
          ref: ${{ env.OC3D_CORE_REF }}
          path: oc3d-core

      - name: Check out autofix-core
        uses: actions/checkout@v4
        with:
          repository: ${{ env.AUTOFIX_CORE_REPO }}
          ref: ${{ env.AUTOFIX_CORE_REF }}
          path: autofix-core

      # Java 21 builds it; the bytecode target stays at 8, set by pom-scijava.
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Each core runs its own suite, so a core failure is never reported as a
      # plugin failure. Order does not matter: neither core depends on the other.
      - name: Build and install oc3d-core
        run: mvn --batch-mode --no-transfer-progress -f oc3d-core/pom.xml clean install

      - name: Build and install autofix-core
        run: mvn --batch-mode --no-transfer-progress -f autofix-core/pom.xml clean install

      - name: Build and verify the plugin
        working-directory: plugin
        run: bash mvnw --batch-mode --no-transfer-progress clean verify

      # Guards the shading, which is what makes the one-jar install work. A
      # regression here is silent: the jar still builds and still runs on a
      # developer machine, and only breaks for users whose Fiji has a sibling
      # plugin carrying the same classes.
      - name: Check the shaded jar
        working-directory: plugin
        run: |
          JAR=$(ls target/RegistrationDriftComparison-*.jar \
                | grep -v -e '-sources\.jar$' -e '-tests\.jar$' -e 'original-' -e '-shaded')
          echo "Checking $JAR"
          unzip -Z1 "$JAR" | grep -q '^plugins.config$' \
            || { echo "FAIL: plugins.config missing"; exit 1; }
          test "$(unzip -Z1 "$JAR" | grep -c '^sc/fiji/')" -eq 0 \
            || { echo "FAIL: unrelocated sc/fiji classes in the jar"; exit 1; }
          test "$(unzip -Z1 "$JAR" | grep -c '^ij/')" -eq 0 \
            || { echo "FAIL: ImageJ classes bundled into the jar"; exit 1; }
          unzip -Z1 "$JAR" | grep -q '^regdrift/internal/core/' \
            || { echo "FAIL: oc3d-core not shaded in"; exit 1; }
          unzip -Z1 "$JAR" | grep -q '^regdrift/internal/autofix/' \
            || { echo "FAIL: autofix-core not shaded in"; exit 1; }
          if unzip -p "$JAR" META-INF/MANIFEST.MF | grep -q '^Class-Path:'; then
            echo "FAIL: shaded cores must not appear as external class-path jars"
            exit 1
          fi
          echo "OK: $(unzip -Z1 "$JAR" | grep -c '^regdrift/internal/') relocated internal entries"

      - name: Upload the plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: RegistrationDriftComparison-jar
          path: |
            plugin/target/RegistrationDriftComparison-*.jar
            !plugin/target/*-sources.jar
            !plugin/target/*-tests.jar
            !plugin/target/*-javadoc.jar
          if-no-files-found: error
